<header class="flex items-center justify-between h-[73px] px-6 bg-white border-b border-gray-200 shadow-sm flex-shrink-0">
  <!-- Left: Hamburger + Title -->
  <div class="flex items-center gap-4">
    <button
      (click)="onToggle()"
      class="p-2 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors"
      title="Toggle Sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div>
      <h1 class="text-lg font-semibold text-gray-800">AutoNest</h1>
      <p class="text-xs text-gray-400">Garage Management System</p>
    </div>
  </div>

  <!-- Right: Actions -->
  <div class="flex items-center gap-3">
    <!-- Notification Bell -->
    <button class="relative p-2 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- User Avatar -->
    <div class="flex items-center gap-2 pl-2 border-l border-gray-200">
      <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
        SK
      </div>
      <div class="hidden sm:block">
        <p class="text-sm font-medium text-gray-700">Sathish K</p>
        <p class="text-xs text-gray-400">Administrator</p>
      </div>
    </div>
  </div>
</header>
